id = "network"
cat = "ops"
icon = "🌐"
phrase = "checking the network"
tool = ["Bash"]
cmd = ['^(ss|netstat|ip|ping|dig|nslookup|host|traceroute|nmap|ufw|iptables|nft|nc|wg|resolvectl)\b', '^tailscale\b']
conf = 0.8

[[act]]
id = "desktop"
cat = "ops"
icon = "🖥"
phrase = "adjusting the desktop"
ask = "adjusting {what} on the desktop"
tool = ["Bash"]
cmd = ['^(hyprctl|omarchy|omarchy-[\w-]+|swaymsg|wlr-randr|waybar|makoctl|swww|swaybg|hyprpaper|walker|gsettings|xdg-mime|xdg-settings|brightnessctl|wpctl|pactl|playerctl)\b', '\.config/(hypr|waybar|omarchy|alacritty|ghostty|kitty|foot|walker|mako)\b']
conf = 0.8

[[act]]
id = "gpu-check"
cat = "ops"
icon = "🎛"
phrase = "checking the GPU"
tool = ["Bash"]
cmd = ['^(nvidia-smi|nvtop|rocm-smi|intel_gpu_top|gpustat)\b', '\btorch\.cuda\.is_available\b']
conf = 0.85

[[act]]
id = "disk-usage"
cat = "ops"
icon = "💽"
phrase = "checking disk space"
tool = ["Bash"]
cmd = ['^(du|df|ncdu|duf|dust|lsblk|findmnt|mount|umount|btrfs|smartctl|fdisk|parted|mkfs)\b']
conf = 0.8

[[act]]
id = "permissions"
cat = "ops"
icon = "🔐"
phrase = "sorting out permissions"
tool = ["Bash"]
cmd = ['^(sudo|chmod|chown|setfacl|usermod|groups|id)\b', '^ssh-(keygen|add|copy-id)\b', '^gpg\b']
conf = 0.7

[[act]]
id = "remote-shell"
cat = "ops"
phrase = "working on {thing|a remote machine}"
tool = ["Bash"]
cmd = ['^(ssh|mosh)\b(?: -\S+)* (?:\w+@)?(?P<thing>[\w.-]+)']
conf = 0.8

[[act]]
id = "claude-config"
cat = "ops"
icon = "🔧"
phrase = "configuring Claude Code"
tool = ["Bash", "Read"]
cmd = ['^claude (plugin|mcp|config|doctor|update|install|--version|--help)\b', '\.claude/(settings|plugins|hooks|keybindings)']
path = ['\.claude/(settings[\w.]*\.json|keybindings\.json|hooks/)']
conf = 0.8

[[act]]
id = "mod-hooks"
cat = "coding"
phrase = "working on the Claude mod"
ask = "working on {what} in the Claude mod"
tool = ["Bash", "Read", "Write", "Edit"]
path = ['(^|/)mod/[\w-]+/hooks/', '(^|/)plugin/hooks/', 'register\.ts$']
cmd = ['claude-code\.d\.ts']
conf = 0.8

[[act]]
id = "env-check"
cat = "ops"
phrase = "checking the setup"
tool = ["Bash"]
cmd = ['^(which|type|command -v|whereis|env|printenv|uname|hostnamectl|hostname|whoami|date|uptime|locale|lscpu|free|nproc|sensors|lspci|lsusb|systemd-analyze|fastfetch|neofetch)\b', '\s--version\s*$', '^\S+ (-V|--version)\b']
conf = 0.65

[[act]]
id = "inspect-binary"
cat = "research"
phrase = "inspecting a binary"
tool = ["Bash"]
cmd = ['^(strings|objdump|readelf|nm|ldd|file|xxd|hexdump|od|gdb|lldb|strace|ltrace)\b']
conf = 0.75

[[act]]
id = "help-pages"
cat = "research"
icon = "📖"
phrase = "reading the {thing} docs"
alt = "reading a tool's help"
tool = ["Bash"]
cmd = ['^(?P<thing>[\w-]+)( [\w-]+)? (--help|-h|help)\b', '^(man|tldr|info) (?P<thing>[\w-]+)', '^(?P<thing>[\w-]+) --skill\b', '^agent-browser skills? get\b']
conf = 0.8

# ======================================================================================================
# Research: reading code and docs, searching, the web
# ======================================================================================================

[[act]]
id = "load-skill"
cat = "research"
icon = "📖"
phrase = "reading the {skill|} skill"
alt = "reading a skill"
tool = ["Skill"]
conf = 0.85

[[act]]
id = "load-tools"
cat = "research"
phrase = "loading tools"
tool = ["ToolSearch", "ListMcpResourcesTool", "ReadMcpResourceTool"]
conf = 0.6

[[act]]
id = "web-search"
cat = "research"
icon = "🌐"
phrase = "searching the web[ for {query}]"
ask = "searching the web for {what}"
tool = ["WebSearch", "mcp__*search*", "mcp__exa__*", "mcp__perplexity__*"]
conf = 0.85

[[act]]
id = "read-docs-web"
cat = "research"
icon = "📖"
phrase = "reading {site|the docs}"
tool = ["WebFetch", "Bash"]
host = ['(^|\.)(docs|developer|developers|learn|api|code)\.', '(^|\.)(docs\.rs|readthedocs\.io|developer\.mozilla\.org|man7\.org|archlinux\.org|python\.org|rust-lang\.org|crates\.io|npmjs\.com|pypi\.org)$']
conf = 0.8

[[act]]
id = "read-github"
cat = "research"
phrase = "reading {thing|code} on GitHub"
tool = ["WebFetch", "Bash", "mcp__github__*"]
host = ['(^|\.)(github\.com|githubusercontent\.com|gitlab\.com|codeberg\.org)$']
url = ['github\.com/(?P<thing>[\w.-]+/[\w.-]+)']
conf = 0.8

[[act]]
id = "fetch-page"
cat = "research"
icon = "🌐"
phrase = "reading {site|a web page}"
ask = "reading about {what}"
tool = ["WebFetch", "mcp__fetch__*"]
conf = 0.8

[[act]]
id = "fetch-web-shell"
cat = "research"
icon = "🌐"
phrase = "fetching {site|a web page}"
tool = ["Bash"]
cmd = ['^curl\b.*https?://', '^(wget|http|xh) .*https?://']
conf = 0.75

[[act]]
id = "read-own-docs"
cat = "research"
icon = "📖"
phrase = "reading {file|the notes}"
ask = "reading {what}"
tool = ["Read", "Bash"]
path = ['(?i)\.(md|mdx|rst|txt)$']
not = ['^\s*(sed -i|cat >|tee|echo .*>)']
conf = 0.75

[[act]]
id = "search-code"
cat = "research"
phrase = "searching the code[ for {thing}]"
ask = "searching the code for {what}"
tool = ["Grep", "Bash"]
bare = ["Grep"]
cmd = ['^(grep|egrep|rg|ag|ack|git grep|/usr/bin/grep)\b']
conf = 0.75

[[act]]
id = "find-files"
cat = "research"
phrase = "looking for files"
tool = ["Glob", "Bash"]
bare = ["Glob"]
cmd = ['^(find|fd|locate|plocate)\b']
conf = 0.75

[[act]]
id = "explore-tree"
cat = "research"
phrase = "looking around[ {project}]"
ask = "looking around {what}"
tool = ["Bash", "LS"]
bare = ["LS"]
cmd = ['^(ls|tree|eza|exa|lsd|realpath|readlink|stat|basename|dirname)\b']
conf = 0.7

[[act]]
id = "read-code"
cat = "research"
phrase = "reading {file|the code}"
ask = "reading {what}"
tool = ["Read", "Bash"]
bare = ["Read"]
cmd = ['^(cat|sed -n|head|tail|less|more|bat|wc|nl|awk|cut|sort|uniq|diff|cmp|column|tr)\b']
conf = 0.7

[[act]]
id = "python-script"
cat = "data"
phrase = "{desc_ing|running a Python script}"
ask = "running a script to {what}"
tool = ["Bash"]
cmd = ['^python3?\s+-\s*<<', '^python3? -c\b', '^(?:\S*/)?python3?\s+(?P<path>\S+\.py)\b', '^\S+/bin/python\b']
conf = 0.55

[[act]]
id = "node-script"
cat = "jobs"
phrase = "{desc_ing|running a script}"
tool = ["Bash"]
cmd = ['^(node|bun|deno|tsx|ts-node) (?P<path>\S+\.[mc]?[jt]s)\b', '^(node|bun|deno) -e\b']
conf = 0.55

[[act]]
id = "shell-script"
cat = "jobs"
phrase = "{desc_ing|running a script}"
tool = ["Bash"]
cmd = ['^(bash|sh|zsh) (?P<path>\S+\.sh)\b', '^\.?/?(?P<path>[\w./~$-]+\.sh)\b', '^(\./|~/|/)[\w./-]+\s*']
conf = 0.5

[[act]]
id = "output-print"
cat = "thinking"
phrase = "jotting something down"
tool = ["Bash"]
cmd = ['\A(echo|printf)\b.*\z']
conf = 0.4

# ======================================================================================================
# Fallbacks from the description alone (any tool with a description)
# ======================================================================================================

[[act]]
id = "desc-read"
cat = "research"
phrase = "{desc_ing}"
alt = "reading code"
desc = ['^(read|inspect|check|look|view|show|see|print|dump|list|find|locate|grep|search|scan|peek|examine|review|study|explore|investigate|survey|map|trace|probe|identify|figure out|learn|understand|compare|diff|get|fetch|load|open|query|count)\b']
conf = 0.6

[[act]]
id = "desc-test"
cat = "verifying"
phrase = "{desc_ing}"
alt = "testing"
desc = ['^(test|retest|rerun|re-run|run|validate|measure|time|reproduce|repro|debug|diagnose|try|retry|simulate)\b']
conf = 0.6

[[act]]
id = "desc-write"
cat = "coding"
phrase = "{desc_ing}"
alt = "writing code"
desc = ['^(write|draft|generate|scaffold|port|convert|translate|wrap|hide|show|guard|limit|cap|pin|keep|allow|block|prefer|use|let|stop|start|launch|kill|close|reset|init|install|register|unregister|mark|record|save|store|cache|apply|commit|deploy|serve|restart|reload|clear|capture|screenshot|snap|shoot|render|crop|resize|annotate|document|note|log|append|insert|copy|move|rename|replace)\b']
conf = 0.55

[[act]]
id = "desc-any"
cat = "thinking"
phrase = "{desc_ing}"
alt = "working"
desc = ['^\w']
conf = 0.45

# Between calls with nothing to go on (set by activity.rs, never matched against a call)
[[act]]
id = "thinking"
cat = "thinking"
phrase = "thinking it through"
ask = "thinking through {what}"
tool = ["@none"]
conf = 0.3

[[act]]
id = "writing-reply"
cat = "thinking"
phrase = "writing up the answer"
ask = "writing up {what}"
tool = ["@none"]
conf = 0.4

# Last resorts per tool (never counted as "classified")
[[act]]
id = "bash-other"
cat = "thinking"
phrase = "running a command"
tool = ["Bash", "PowerShell"]
conf = 0.3

[[act]]
id = "mcp-other"
cat = "comms"
phrase = "using {thing|a connector}"
tool = ["mcp__*"]
conf = 0.4

[[act]]
id = "tool-other"
cat = "thinking"
phrase = "working"
conf = 0.2
