# Activity taxonomy: what an agent is doing, read from its tool calls (server/src/activity.rs).
#
# Rules are tried in file order; the first match wins, so specific rules come before broad ones.
# A rule matches when its `tool` filter passes (exact name, or a `prefix*` glob; no filter = any tool) and
# at least one of its pattern lists matches (no pattern lists = the tool alone is enough).
# `not` vetoes a match (tested on the command and the description).
#
# `all = true`: every pattern list must match (default: any one).
# `bare` lists tools that match on their own, without any pattern (e.g. Read for "reading {file}").
#
# Pattern lists (regex-lite syntax, literal TOML strings):
#   cmd    the Bash command, normalised: one segment per line (split on newlines, && || ; |), with env
#          assignments, `cd`, `export` and wrappers (timeout, time, sudo, nohup, env, uv run, npx) stripped.
#          Multi-line mode is on, so `^` anchors a segment start. Case-sensitive.
#   desc   the Bash call's description, or a subagent's description (case-insensitive)
#   path   the file path (Read/Write/Edit/NotebookEdit, Grep/Glob path, else the first path in the command)
#   ext    file extensions of that path (no dot)
#   host   host of the URL (WebFetch, browser tools, or the first URL in the command)
#   url    the whole URL
#   query  the WebSearch query
#   agent  subagent type + description
#   todo   the in-progress todo item (TodoWrite activeForm / TaskUpdate)
#
# Phrase: a present-participle phrase that reads after "<agent> is ". Slots:
#   {slot}          must be filled, or the rule falls back to `alt`, then to the category's phrase
#   {slot|text}     slot, else the literal text
#   [ ... ]         optional: dropped when a slot inside it is empty
# Built-in slots: file (basename of the path), project (repo folder), site (pretty host), item (search terms
# in the URL), query, what (description minus its verb), desc_ing (description as a gerund phrase),
# agent (subagent description as a gerund phrase), skill, session (agent-browser session), todo.
# Named regex groups (?P<name>…) fill the slot of the same name (`path` sets file/project).
#
# ask: the template Haiku fills instead of `phrase` (no file paths, so {what} = the subject of the work).
# progress = true: the activity usually reports progress (tests, builds, training, downloads...).
# conf: how sure the rule is (default 0.8). Below 0.6 the agent may get a Haiku pass.

version = 1

[categories]
needs     = { label = "Needs you",     icon = "✋", phrase = "waiting for you" }
comms     = { label = "Communicating", icon = "💬", phrase = "talking to other agents" }
coding    = { label = "Coding",        icon = "⌨️", phrase = "writing code" }
verifying = { label = "Verifying",     icon = "🧪", phrase = "checking the work" }
git       = { label = "Git",           icon = "🌿", phrase = "working in git" }
research  = { label = "Research",      icon = "🔎", phrase = "looking things up" }
browsing  = { label = "Browsing",      icon = "🛒", phrase = "browsing the web" }
jobs      = { label = "Running jobs",  icon = "⏳", phrase = "running a job" }
planning  = { label = "Planning",      icon = "🧭", phrase = "planning" }
waiting   = { label = "Waiting",       icon = "⏸", phrase = "waiting" }
docs      = { label = "Writing docs",  icon = "📝", phrase = "writing docs" }
data      = { label = "Data",          icon = "📊", phrase = "crunching data" }
ops       = { label = "System",        icon = "⚙️", phrase = "tending the system" }
design    = { label = "Design",        icon = "🎨", phrase = "working on visuals" }
mail      = { label = "Mail",          icon = "✉️", phrase = "going through mail" }
thinking  = { label = "Thinking",      icon = "💭", phrase = "thinking" }

# Pretty names for hosts ({site}). Unknown hosts: the second-level label, capitalised.
[sites]
"github.com" = "GitHub"
"api.github.com" = "GitHub"
"huggingface.co" = "Hugging Face"
"google.com" = "Google"
"youtube.com" = "YouTube"
"docs.rs" = "docs.rs"
"crates.io" = "crates.io"
"npmjs.com" = "npm"
"pypi.org" = "PyPI"
"code.claude.com" = "the Claude docs"
"docs.anthropic.com" = "the Anthropic docs"
"stackoverflow.com" = "Stack Overflow"
"reddit.com" = "Reddit"
"wikipedia.org" = "Wikipedia"
"arxiv.org" = "arXiv"
"omarchy.org" = "omarchy.org"

# ======================================================================================================
# Needs you: the agent is blocked on the user
# ======================================================================================================

[[act]]
id = "ask-question"
cat = "needs"
phrase = "asking you a question"
tool = ["AskUserQuestion"]
conf = 0.95

[[act]]
id = "ask-phone"
cat = "needs"
phrase = "asking you on the phone"
tool = ["mcp__sheprd__ask_phone"]
conf = 0.95

[[act]]
id = "plan-approval"
cat = "needs"
phrase = "waiting for you to approve the plan"
tool = ["ExitPlanMode"]
conf = 0.9

# ======================================================================================================
# Communicating
# ======================================================================================================

[[act]]
id = "surface-card"
cat = "comms"
icon = "📌"
phrase = "putting a card on your phone"
ask = "putting {what} on your phone"
tool = ["mcp__sheprd__surface"]
conf = 0.9

[[act]]
id = "report-back"
cat = "comms"
phrase = "reporting back"
ask = "reporting back on {what}"
tool = ["SubagentHandback"]
conf = 0.9

[[act]]
id = "message-agent"
cat = "comms"
phrase = "messaging another agent"
ask = "messaging another agent about {what}"
tool = ["SendMessage", "mcp__sheprd__steer", "mcp__sheprd__send"]
conf = 0.85

[[act]]
id = "steer-agent"
cat = "comms"
phrase = "steering another agent"
ask = "steering another agent on {what}"
tool = ["Bash"]
cmd = ['^herdr (agent|pane) (prompt|send|send-text|keys|send-keys)\b', '/api/a/[^/\s]+/(prompt|steer|text|keys)\b']
conf = 0.85

[[act]]
id = "read-agent"
cat = "comms"
phrase = "checking on another agent"
ask = "checking on {what}"
tool = ["Bash"]
cmd = ['^herdr (agent|pane) (read|get|list|wait|watch)\b', '^herdr agent\b']
conf = 0.8

[[act]]
id = "list-agents"
cat = "comms"
phrase = "checking on the other agents"
tool = ["ListAgents", "TaskList", "TaskGet"]
conf = 0.8

[[act]]
id = "send-email"
cat = "mail"
phrase = "sending an email"
tool = ["mcp__claude_ai_Gmail__send*", "mcp__claude_ai_Gmail__create_draft*", "mcp__claude_ai_Gmail__reply*"]
conf = 0.9

[[act]]
id = "push-notify"
cat = "comms"
phrase = "sending you a notification"
tool = ["Bash", "PushNotification"]
cmd = ['notify-send\b', '/api/push\b']
conf = 0.75

[[act]]
id = "slack"
cat = "comms"
phrase = "messaging on Slack"
tool = ["mcp__claude_ai_Slack*", "mcp__slack*"]
conf = 0.85

[[act]]
id = "doc-comment"
cat = "comms"
phrase = "replying to a comment"
tool = ["ArtifactComments"]
conf = 0.85

# ======================================================================================================
# Mail
# ======================================================================================================

[[act]]
id = "mail-read"
cat = "mail"
phrase = "reading mail"
tool = ["mcp__claude_ai_Gmail__get*", "mcp__claude_ai_Gmail__read*"]
conf = 0.85

[[act]]
id = "mail-search"
cat = "mail"
phrase = "searching the inbox"
tool = ["mcp__claude_ai_Gmail__search*", "mcp__claude_ai_Gmail__list*"]
conf = 0.85

[[act]]
id = "mail-label"
cat = "mail"
phrase = "filing mail"
tool = ["mcp__claude_ai_Gmail__*label*", "mcp__claude_ai_Gmail__modify*", "mcp__claude_ai_Gmail__archive*"]
conf = 0.85

[[act]]
id = "mail-other"
cat = "mail"
phrase = "going through mail"
tool = ["mcp__claude_ai_Gmail__*"]
conf = 0.75

[[act]]
id = "calendar"
cat = "planning"
icon = "📅"
phrase = "checking the calendar"
tool = ["mcp__claude_ai_Google_Calendar__*", "mcp__*calendar*"]
conf = 0.85

# ======================================================================================================
# Planning and delegating
# ======================================================================================================

[[act]]
id = "plan-todos"
cat = "planning"
phrase = "planning the steps"
ask = "planning {what}"
tool = ["TodoWrite", "TaskCreate"]
conf = 0.7

[[act]]
id = "update-todos"
cat = "planning"
phrase = "ticking off a step"
tool = ["TaskUpdate"]
conf = 0.6

[[act]]
id = "enter-plan"
cat = "planning"
phrase = "drawing up a plan"
tool = ["EnterPlanMode"]
conf = 0.8

[[act]]
id = "schedule-wakeup"
cat = "planning"
icon = "⏰"
phrase = "scheduling a wake-up"
ask = "scheduling {what}"
tool = ["CronCreate", "CronDelete", "CronList", "ScheduleWakeup", "mcp__scheduled-tasks__*"]
conf = 0.85

[[act]]
id = "sub-explore"
cat = "research"
phrase = "{agent}"
ask = "researching {what} with a subagent"
alt = "exploring with a subagent"
tool = ["Agent", "Task"]
agent = ['^(explore|plan)\b', '(?i)\b(explore|survey|research|investigate|find|map|analy[sz]e|evaluate|look into)\b']
conf = 0.8

[[act]]
id = "sub-review"
cat = "verifying"
phrase = "{agent}"
ask = "getting {what} reviewed"
alt = "getting a review"
tool = ["Agent", "Task"]
agent = ['(?i)\b(review|audit|qa|bug bash|critique)\b']
conf = 0.8

[[act]]
id = "sub-build"
cat = "coding"
phrase = "{agent}"
ask = "building {what} with a subagent"
alt = "building with a subagent"
tool = ["Agent", "Task"]
agent = ['(?i)\b(build|implement|add|fix|write|create|port|refactor|wire)\b']
conf = 0.8

[[act]]
id = "sub-design"
cat = "design"
phrase = "{agent}"
ask = "designing {what} with a subagent"
alt = "designing with a subagent"
tool = ["Agent", "Task"]
agent = ['(?i)\b(design|mock ?up|ux|spec)\b']
conf = 0.8

[[act]]
id = "subagent"
cat = "planning"
phrase = "{agent}"
ask = "delegating {what} to a subagent"
alt = "delegating to a subagent"
tool = ["Agent", "Task"]
conf = 0.7

[[act]]
id = "stop-task"
cat = "planning"
phrase = "stopping a background task"
tool = ["TaskStop", "KillShell", "KillBash"]
conf = 0.7

[[act]]
id = "spawn-agent"
cat = "planning"
phrase = "starting a new agent"
ask = "starting an agent for {what}"
tool = ["Bash"]
cmd = ['^herdr (agent start|tab create|workspace create|pane split|worktree)\b', '/api/new\b', '^claude --resume\b']
conf = 0.8

[[act]]
id = "herdr-other"
cat = "planning"
phrase = "arranging agents in herdr"
ask = "arranging agents for {what}"
tool = ["Bash"]
cmd = ['^herdr\b', 'hc\.py (agent|tab|pane|workspace|worktree)\.']
not = ['(--help|--skill|\shelp\b)']
conf = 0.65

[[act]]
id = "headless-claude"
cat = "jobs"
phrase = "running a helper Claude"
ask = "asking a helper Claude about {what}"
tool = ["Bash"]
cmd = ['^claude -p\b', '^claude .*--print\b', '^claude\b.*--model haiku']
conf = 0.75

# ======================================================================================================
# Waiting
# ======================================================================================================

[[act]]
id = "wait-output"
cat = "waiting"
phrase = "waiting for a background task"
tool = ["TaskOutput", "BashOutput", "Monitor", "AgentOutputTool"]
conf = 0.75

[[act]]
id = "wait-poll"
cat = "waiting"
phrase = "waiting for {thing|something to finish}"
tool = ["Bash"]
cmd = ['^until\b', '^while (true|:|!)', 'wait_for_output', '^tail -f\b', '^inotifywait\b']
conf = 0.7

[[act]]
id = "wait-sleep"
cat = "waiting"
phrase = "waiting a moment"
tool = ["Bash"]
cmd = ['\Asleep \d+\S*\s*\z', 'time\.sleep\(\d+\)\S*\s*\z']
conf = 0.6

# ======================================================================================================
# Shipping: deploys and releases (before git and builds: they wrap both)
# ======================================================================================================

[[act]]
id = "deploy-script"
cat = "jobs"
icon = "🚀"
phrase = "deploying[ {project}]"
ask = "deploying {what}"
progress = true
tool = ["Bash"]
cmd = ['(^|/)deploy(/install)?\.sh\b', '^\S*deploy\S*\.sh\b', '^make (deploy|install|release)\b', '^just deploy\b']
conf = 0.9

[[act]]
id = "deploy-cloud"
cat = "jobs"
icon = "🚀"
phrase = "deploying to {site|the cloud}"
progress = true
tool = ["Bash"]
cmd = ['^(vercel|netlify|fly|flyctl|wrangler|railway|heroku)\b.*\b(deploy|publish|up)\b', '^kubectl (apply|rollout)\b', '^helm (install|upgrade)\b', '^terraform apply\b', '^gcloud .*deploy\b', '^aws .*deploy\b']
conf = 0.9

[[act]]
id = "release"
cat = "git"
icon = "🏷"
phrase = "cutting a release"
tool = ["Bash"]
cmd = ['^gh release\b', '^git tag\b', '^cargo publish\b', '^npm publish\b', '^twine upload\b']
conf = 0.85

[[act]]
id = "service-restart"
cat = "ops"
phrase = "restarting {thing|a service}"
ask = "restarting {what}"
tool = ["Bash"]
cmd = ['^systemctl (--user )?(restart|reload|start|stop|enable|disable|daemon-reload)\b ?(?P<thing>[\w@.-]+)?', 'mock-restart\.sh']
conf = 0.85

# ======================================================================================================
# Git and GitHub
# ======================================================================================================

[[act]]
id = "git-commit"
cat = "git"
phrase = "committing[ {what}]"
tool = ["Bash"]
cmd = ['^git( -C \S+)? commit\b']
conf = 0.9

[[act]]
id = "git-push"
cat = "git"
phrase = "pushing to {thing|the remote}"
tool = ["Bash"]
cmd = ['^git( -C \S+)? push\b(?: \S+ (?P<thing>[\w./-]+))?']
conf = 0.9

[[act]]
id = "pr-open"
cat = "git"
phrase = "opening a pull request"
tool = ["Bash", "mcp__github__create_pull_request"]
cmd = ['^gh pr create\b']
conf = 0.9

[[act]]
id = "pr-review"
cat = "git"
phrase = "reviewing a pull request"
tool = ["Bash", "mcp__github__*review*", "mcp__github__get_pull_request*"]
cmd = ['^gh pr (view|diff|review|checks|comment)\b', '^gh api .*pulls']
conf = 0.85

[[act]]
id = "pr-merge"
cat = "git"
phrase = "merging a pull request"
tool = ["Bash"]
cmd = ['^gh pr (merge|close|ready)\b']
conf = 0.9

[[act]]
id = "ci-check"
cat = "verifying"
phrase = "checking CI"
progress = true
tool = ["Bash"]
cmd = ['^gh (run|workflow)\b', '^gh pr checks\b']
conf = 0.85

[[act]]
id = "gh-issue"
cat = "git"
phrase = "working on a GitHub issue"
tool = ["Bash", "mcp__github__*issue*"]
cmd = ['^gh issue\b']
conf = 0.85

[[act]]
id = "gh-repo"
cat = "research"
phrase = "looking around {thing|a GitHub repo}"
tool = ["Bash"]
cmd = ['^gh (repo|search|browse)\b(?: \w+ (?P<thing>[\w.-]+/[\w.-]+))?', '^gh api\b']
conf = 0.8

[[act]]
id = "git-rebase"
cat = "git"
phrase = "rebasing[ onto {thing}]"
tool = ["Bash"]
cmd = ['^git( -C \S+)? rebase\b(?: (?P<thing>[\w./-]+))?']
conf = 0.9

[[act]]
id = "git-merge"
cat = "git"
phrase = "merging {thing|branches}"
tool = ["Bash"]
cmd = ['^git( -C \S+)? merge\b(?: (?P<thing>[\w./-]+))?']
conf = 0.85

[[act]]
id = "git-conflicts"
cat = "git"
phrase = "resolving merge conflicts"
tool = ["Bash"]
cmd = ['^git( -C \S+)? (mergetool|checkout --(ours|theirs))\b', '<<<<<<<']
conf = 0.85

[[act]]
id = "git-cherry-pick"
cat = "git"
phrase = "cherry-picking a commit"
tool = ["Bash"]
cmd = ['^git( -C \S+)? cherry-pick\b']
conf = 0.9

[[act]]
id = "git-revert"
cat = "git"
phrase = "undoing a change"
tool = ["Bash"]
cmd = ['^git( -C \S+)? (revert|reset|restore)\b', '^git( -C \S+)? checkout (HEAD )?-- ']
conf = 0.8

[[act]]
id = "git-stash"
cat = "git"
phrase = "stashing changes"
tool = ["Bash"]
cmd = ['^git( -C \S+)? stash\b']
conf = 0.85

[[act]]
id = "git-worktree"
cat = "git"
phrase = "setting up a worktree"
tool = ["Bash", "EnterWorktree", "ExitWorktree"]
cmd = ['^git( -C \S+)? worktree\b']
conf = 0.85

[[act]]
id = "git-branch"
cat = "git"
phrase = "switching to {thing|a branch}"
tool = ["Bash"]
cmd = ['^git( -C \S+)? (switch|checkout)( -[bcB])? (?P<thing>[\w./-]+)\s*$', '^git( -C \S+)? branch\b']
conf = 0.8

[[act]]
id = "git-pull"
cat = "git"
phrase = "pulling the latest changes"
tool = ["Bash"]
cmd = ['^git( -C \S+)? (pull|fetch|clone)\b']
conf = 0.85

[[act]]
id = "git-stage"
cat = "git"
phrase = "staging changes"
ask = "staging {what}"
tool = ["Bash"]
cmd = ['^git( -C \S+)? (add|update-index|hash-object|apply)\b']
conf = 0.8

[[act]]
id = "git-diff"
cat = "git"
phrase = "reviewing the diff"
ask = "reviewing the diff for {what}"
tool = ["Bash"]
cmd = ['^git( -C \S+)?( --no-pager)? diff\b']
conf = 0.8

[[act]]
id = "git-log"
cat = "git"
phrase = "reading the git history"
tool = ["Bash"]
cmd = ['^git( -C \S+)?( --no-pager)? (log|show|blame|reflog|shortlog|bisect)\b']
conf = 0.8

[[act]]
id = "git-status"
cat = "git"
phrase = "checking what changed"
tool = ["Bash"]
cmd = ['^git( -C \S+)? (status|rev-parse|ls-files|remote|config|describe|cat-file)\b']
conf = 0.7

[[act]]
id = "git-other"
cat = "git"
phrase = "working in git"
tool = ["Bash"]
cmd = ['^git\b']
conf = 0.6

# ======================================================================================================
# Verifying: tests, builds, type checks, linters
# ======================================================================================================

[[act]]
id = "test-rust"
cat = "verifying"
phrase = "running the[ {project}] tests"
progress = true
tool = ["Bash"]
cmd = ['^cargo (test|nextest|t)\b']
conf = 0.9

[[act]]
id = "test-python"
cat = "verifying"
phrase = "running the[ {project}] tests"
progress = true
tool = ["Bash"]
cmd = ['^(python3? -m )?pytest\b', '^python3? -m unittest\b', '^tox\b', '^nox\b']
conf = 0.9

[[act]]
id = "test-js"
cat = "verifying"
phrase = "running the[ {project}] tests"
progress = true
tool = ["Bash"]
cmd = ['^(npm|pnpm|yarn|bun) (run )?test\b', '^(vitest|jest|mocha|ava|playwright test)\b', '^bun test\b', '^deno test\b', '^node --test\b']
conf = 0.9

[[act]]
id = "test-go"
cat = "verifying"
phrase = "running the[ {project}] tests"
progress = true
tool = ["Bash"]
cmd = ['^go test\b', '^(mix|rspec|bundle exec rspec|phpunit|ctest|swift test|dotnet test|gradle test|mvn test)\b']
conf = 0.9

[[act]]
id = "test-ui"
cat = "verifying"
icon = "📱"
phrase = "running the {thing} UI test"
ask = "testing {what} in a browser"
alt = "testing the UI in a browser"
progress = true
tool = ["Bash"]
cmd = ['^node \S*\bt-(?P<thing>[\w-]+)\.m?js\b', '^node \S*\b(test|e2e|spec)[\w-]*\.m?js\b']
conf = 0.85

[[act]]
id = "screenshot-ui"
cat = "verifying"
icon = "📸"
phrase = "screenshotting the app"
ask = "screenshotting {what}"
tool = ["Bash"]
cmd = ['^node \S*(shoot|shot|screenshot|capture|snap|anim|probe)\w*\.m?js\b', '^(grim|scrot|spectacle|hyprshot|import -window)\b', 'page\.screenshot\(']
conf = 0.85

[[act]]
id = "build-rust"
cat = "verifying"
icon = "🔨"
phrase = "building[ {project}]"
progress = true
tool = ["Bash"]
cmd = ['^cargo (build|b|run|install)\b']
conf = 0.85

[[act]]
id = "typecheck-rust"
cat = "verifying"
phrase = "type-checking[ {project}]"
tool = ["Bash"]
cmd = ['^cargo (check|c)\b']
conf = 0.85

[[act]]
id = "lint-rust"
cat = "verifying"
phrase = "linting[ {project}]"
tool = ["Bash"]
cmd = ['^cargo (clippy|fmt|audit|deny|udeps)\b', '^rustfmt\b']
conf = 0.85

[[act]]
id = "build-js"
cat = "verifying"
icon = "🔨"
phrase = "building[ {project}]"
progress = true
tool = ["Bash"]
cmd = ['^(npm|pnpm|yarn|bun) (run )?build\b', '^(vite|webpack|esbuild|rollup|tsup|parcel|next) build\b', '^esbuild\b']
conf = 0.85

[[act]]
id = "typecheck-ts"
cat = "verifying"
phrase = "type-checking[ {project}]"
tool = ["Bash"]
cmd = ['^(tsc|vue-tsc)\b', '^(npm|pnpm|yarn|bun) (run )?(typecheck|type-check|tsc)\b', '^(mypy|pyright|basedpyright)\b']
conf = 0.85

[[act]]
id = "lint-js"
cat = "verifying"
phrase = "linting[ {project}]"
tool = ["Bash"]
cmd = ['^(eslint|biome|prettier|oxlint|stylelint|standard)\b', '^(npm|pnpm|yarn|bun) (run )?(lint|format|fmt)\b']
conf = 0.85

[[act]]
id = "lint-python"
cat = "verifying"
phrase = "linting[ {project}]"
tool = ["Bash"]
cmd = ['^(ruff|black|flake8|pylint|isort)\b', '^python3? -m (ruff|black|flake8|pylint|py_compile|compileall)\b']
conf = 0.85

[[act]]
id = "syntax-check"
cat = "verifying"
phrase = "checking the syntax of {file|a file}"
tool = ["Bash"]
cmd = ['^node (--check|-c) (?P<path>\S+)', '^bash -n (?P<path>\S+)', '^shellcheck\b ?(?P<path>\S+)?', '^python3? -c .?import ast', '^jq (empty|\.) (?P<path>\S+\.json)']
conf = 0.8

[[act]]
id = "build-make"
cat = "verifying"
icon = "🔨"
phrase = "building[ {project}]"
progress = true
tool = ["Bash"]
cmd = ['^(make|ninja|cmake --build|meson compile|just build|gradle build|mvn package|go build|swift build|xcodebuild|zig build)\b', '^(gcc|g\+\+|clang|clang\+\+|rustc|javac) ']
conf = 0.8

[[act]]
id = "bench"
cat = "verifying"
icon = "⏱"
phrase = "benchmarking {thing|performance}"
progress = true
tool = ["Bash"]
