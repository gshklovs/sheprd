# Push a tag like v0.1.0 to publish prebuilt binaries that install.sh downloads.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      # OpenSSL is compiled in (feature `vendored`): the binary only needs glibc >= 2.35.
      - run: cargo build --locked --release --features vendored
        working-directory: server
      - name: package
        run: |
          mkdir dist
          cp server/target/release/sheprd LICENSE README.md dist/
          tar -czf sheprd-${{ matrix.target }}.tar.gz -C dist .
          sha256sum sheprd-${{ matrix.target }}.tar.gz > sheprd-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sheprd-${{ matrix.target }}
          path: sheprd-${{ matrix.target }}.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: sheprd-*.tar.gz*
          generate_release_notes: true
