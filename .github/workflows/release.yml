# Push a tag like v0.1.0 to publish prebuilt binaries that install.sh downloads.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: ${{ matrix.target }}
      # aarch64 is cross-compiled with the Ubuntu toolchain; OpenSSL is compiled in (feature `vendored`),
      # so the binary only needs glibc >= 2.35.
      - name: aarch64 toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc >> "$GITHUB_ENV"
          echo CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc >> "$GITHUB_ENV"
          echo AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar >> "$GITHUB_ENV"
      - name: build
        working-directory: server
        run: cargo build --locked --release --features vendored --target ${{ matrix.target }}
      - name: package
        run: |
          mkdir dist
          cp server/target/${{ matrix.target }}/release/sheprd LICENSE README.md dist/
          tar -czf sheprd-${{ matrix.target }}.tar.gz -C dist .
          sha256sum sheprd-${{ matrix.target }}.tar.gz > sheprd-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sheprd-${{ matrix.target }}
          path: sheprd-${{ matrix.target }}.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: sheprd-*.tar.gz*
          generate_release_notes: true
